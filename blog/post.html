<!DOCTYPE html>
<html lang="ru">
<head>
<base href="/mnemerch-site/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Как выбрать мерч для новогодних корпоративных подарков — mnemerch</title>
<meta name="description" id="pageDesc" content="Советы по выбору новогодних корпоративных подарков: бюджет, наполнение, сроки заказа, тренды. Брендирование мерча в Красноярске.">
<meta property="og:title" id="ogTitle" content="Как выбрать мерч для новогодних корпоративных подарков — mnemerch">
<meta property="og:description" id="ogDesc" content="Советы по выбору новогодних корпоративных подарков: бюджет, наполнение, сроки заказа, тренды.">
<link rel="canonical" href="https://asmaniaqw.github.io/mnemerch-site/blog/post.html">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta property="og:image" content="https://asmaniaqw.github.io/mnemerch-site/og-image.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="header-placeholder"></div>

<div class="breadcrumbs" style="max-width:var(--max-w-narrow);margin:84px auto 0;padding:16px 24px 0;">
  <a href="">Главная</a><span>/</span><a href="blog/">Блог</a><span>/</span><span id="postBreadcrumb">Статья</span>
</div>

<section class="section" style="padding-top:24px;">
  <div class="container-narrow">
    <div id="postLoader" style="text-align:center;padding:60px 24px;color:var(--text-muted);font-size:14px;">Загрузка статьи...</div>
    <article id="postContent" style="display:none;">
      <div style="margin-bottom:32px;">
        <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
          <span id="postCategory" style="padding:3px 10px;border-radius:50px;background:var(--accent-light);font-size:11px;font-weight:600;color:var(--accent);"></span>
          <span id="postDate" style="padding:3px 10px;border-radius:50px;background:var(--light-alt);font-size:11px;font-weight:600;color:var(--text-muted);"></span>
        </div>
        <h1 id="postTitle" style="font-size:clamp(28px,3.5vw,42px);font-weight:800;letter-spacing:-1.5px;line-height:1.05;margin-bottom:16px;"></h1>
        <p id="postDesc" style="font-size:16px;color:var(--text-muted);line-height:1.7;"></p>
      </div>

      <div id="postHero" style="aspect-ratio:16/9;border-radius:20px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:72px;margin-bottom:32px;"></div>

      <div id="postBody" style="font-size:16px;line-height:1.8;color:var(--text-muted);max-width:720px;"></div>
    </article>
  </div>
</section>

<section class="section section-alt">
  <div class="section-inner">
    <div class="section-tag anim"><span></span>Читайте также</div>
    <h2 class="section-title anim d1">Похожие <em>статьи</em></h2>
    <div class="blog-grid" id="relatedGrid"></div>
  </div>
</section>

<section style="background:var(--dark);padding:60px 24px;text-align:center;">
  <div class="section-inner">
    <h2 style="font-size:24px;font-weight:800;color:#fff;margin-bottom:8px;">Нужен корпоративный мерч?</h2>
    <p style="color:rgba(255,255,255,0.45);margin-bottom:24px;">Подберём подарки для вашей компании за 2 часа</p>
    <a href="contact.html" class="btn btn-primary">Получить расчёт →</a>
  </div>
</section>

<div id="footer-placeholder"></div>

<script src="js/components.js"></script>
<script src="js/site-config.js"></script>
<script src="js/privacy-consent.js"></script>
<script src="js/blog-posts.js"></script>
<script>
function esc(s){var d=document.createElement('div');d.textContent=(s===null||s===undefined)?'':String(s);return d.innerHTML;}

var animObserver = new IntersectionObserver(function(entries){
  entries.forEach(function(en){ if(en.isIntersecting) en.target.classList.add('show'); });
}, {threshold:0.06});
document.querySelectorAll('.anim').forEach(function(el){ animObserver.observe(el); });

window.addEventListener('scroll',function(){document.querySelector('.header')?.classList.toggle('scrolled',window.scrollY>10)});

function renderPost(id){
  var posts = window.blogPosts || {};
  var post = posts[id];
  if(!post){ return; }

  document.getElementById('pageTitle').textContent = post.title + ' — mnemerch';
  document.getElementById('pageDesc').setAttribute('content', post.desc);
  document.getElementById('ogTitle').setAttribute('content', post.title + ' — mnemerch');
  document.getElementById('ogDesc').setAttribute('content', post.desc);

  document.getElementById('postBreadcrumb').textContent = post.title;
  document.getElementById('postCategory').textContent = post.category;
  document.getElementById('postDate').textContent = post.date;
  document.getElementById('postTitle').textContent = post.title;
  document.getElementById('postDesc').textContent = post.desc;

  var hero = document.getElementById('postHero');
  hero.style.background = post.gradient;
  hero.textContent = post.emoji;

  document.getElementById('postBody').innerHTML = post.content;

  var allIds = Object.keys(posts);
  var relatedIds = allIds.filter(function(i){ return i !== id; }).slice(0,3);
  var grid = document.getElementById('relatedGrid');
  grid.innerHTML = relatedIds.map(function(rid, idx){
    var rp = posts[rid];
    var delayClass = idx > 0 ? (' d' + idx) : '';
    return '<article class="blog-card anim' + delayClass + '">' +
      '<div class="blog-img"><div style="width:100%;height:100%;background:' + rp.gradient + ';display:flex;align-items:center;justify-content:center;position:absolute;inset:0;font-size:48px;">' + rp.emoji + '</div></div>' +
      '<div class="blog-body"><div class="blog-meta">' + esc(rp.date) + ' · ' + esc(rp.category) + '</div><h3>' + esc(rp.title) + '</h3><p>' + esc(rp.desc) + '</p><a href="blog/post.html?id=' + rid + '" class="blog-link">далее →</a></div>' +
    '</article>';
  }).join('');
  grid.querySelectorAll('.anim').forEach(function(el){ animObserver.observe(el); });

  document.getElementById('postLoader').style.display = 'none';
  document.getElementById('postContent').style.display = 'block';
}

(function(){
  var params = new URLSearchParams(window.location.search);
  var id = params.get('id');
  if(!id || !(window.blogPosts && window.blogPosts[id])) id = '1';
  renderPost(id);
})();
</script>

</body>
</html>
