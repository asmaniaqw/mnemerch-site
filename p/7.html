<script src="js/components.js"></script>
<script>
let productsData = [];
let currentProduct = null;

async function loadProduct() {
  const params = new URLSearchParams(window.location.search);
  const id = parseInt(params.get('id')) || 0;
  document.getElementById('pBreadcrumb').textContent = 'Загрузка...';
  try {
    const r = await fetch('data/products.json?t=' + Date.now());
    const d = await r.json();
    productsData = d.products || [];
    const p = productsData.find(function(x) { return x.id === id; });
    if (p) {
      currentProduct = p;
      renderProduct(p);
    } else {
      document.getElementById('pLoader').textContent = 'Товар не найден (ID: ' + id + ')';
    }
  } catch(e) {
    document.getElementById('pLoader').textContent = 'Ошибка загрузки товара';
    console.error(e);
  }
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderProduct(p) {
  document.getElementById('pLoader').style.display = 'none';
  document.getElementById('pContent').style.display = 'block';
  document.getElementById('pBreadcrumb').textContent = p.name;
  document.title = p.name + ' — mnemerch';

  var img = p.image_local || p.image_url || '';
  document.getElementById('pMainImage').src = img;
  document.getElementById('pMainImage').alt = p.name;
  document.getElementById('pName').textContent = p.name;
  
  document.getElementById('pPrice').innerHTML = p.price ? p.price + ' ₽ <small>за шт.</small>' : 'Цена по запросу';
  document.getElementById('pDesc').textContent = p.description || 'Описание отсутствует. Свяжитесь с нами для подробностей.';
  document.getElementById('pTabDesc').textContent = p.description || 'Описание отсутствует.';

  // Colors
  var colorsEl = document.getElementById('pColors');
  var colors = p.colors_available || [];
  if (colors.length > 0) {
    colorsEl.innerHTML = '<h4>Цвета</h4><div class="color-options">' + colors.map(function(c) {
      return '<span style="background:' + esc(c) + ';width:28px;height:28px;border-radius:50%;display:inline-block;border:2px solid var(--border);" title="' + esc(c) + '"></span>';
    }).join('') + '</div>';
  } else {
    colorsEl.innerHTML = '';
  }

  // Materials
  var matEl = document.getElementById('pMaterials');
  if (p.material) {
    matEl.innerHTML = '<h4>Материал</h4><p style="font-size:14px;color:var(--text-muted);">' + esc(p.material) + '</p>';
  } else {
    matEl.innerHTML = '';
  }

  // Printing methods
  var methodsEl = document.getElementById('pMethods');
  var methods = p.printing_methods || [];
  if (methods.length > 0) {
    methodsEl.innerHTML = '<h4>Способы нанесения</h4><div style="display:flex;gap:8px;flex-wrap:wrap;">' + methods.map(function(m) {
      return '<span style="padding:6px 14px;border-radius:50px;background:var(--accent-light);font-size:12px;font-weight:600;color:var(--accent);">' + esc(m) + '</span>';
    }).join('') + '</div>';
  } else {
    methodsEl.innerHTML = '';
  }

  // Badge
  var badgeEl = document.getElementById('pBadge');
  if (p.tags && p.tags.includes('hit')) {
    badgeEl.textContent = 'Хит продаж';
    badgeEl.style.display = '';
  } else if (p.tags && p.tags.includes('new')) {
    badgeEl.textContent = 'Новинка';
    badgeEl.style.display = '';
  } else {
    badgeEl.style.display = 'none';
  }

  // Thumbnails (gallery)
  var thumbsEl = document.getElementById('pThumbs');
  var gallery = p.gallery || [];
  if (gallery.length > 0) {
    thumbsEl.innerHTML = gallery.map(function(url, i) {
      return '<div class="thumb' + (i === 0 ? ' active' : '') + '" onclick="changeMainImage(this,\'' + esc(url) + '\')"><img src="' + esc(url) + '" alt=""></div>';
    }).join('');
  } else {
    thumbsEl.innerHTML = '<div class="thumb active"><img src="' + esc(img) + '" alt=""></div>';
  }

  // Specs table
  var specs = [
    
    ['Категория', p.category],
    ['Подкатегория', p.subcategory],
    ['Материал', p.material],
    ['Размеры', p.dimensions],
    ['Вес', p.weight],
    ['Объём', p.volume],
    ['Мин. тираж', p.min_quantity ? p.min_quantity + ' шт' : ''],
  ];
  var specsHtml = specs.filter(function(s) { return s[1]; }).map(function(s) {
    return '<div style="padding:10px 14px;border-radius:8px;background:var(--light-alt);"><span style="font-size:12px;color:var(--text-light);">' + esc(s[0]) + '</span><div style="font-weight:600;">' + esc(s[1]) + '</div></div>';
  }).join('');
  document.getElementById('pTabSpecs').innerHTML = specsHtml || '<p style="font-size:15px;color:var(--text-muted);">Нет данных</p>';

  // Printing methods in tab
  var methodsTab = document.getElementById('pTabMethods');
  if (methods.length > 0) {
    methodsTab.innerHTML = methods.map(function(m) {
      return '<div style="padding:16px;border-radius:12px;border:1px solid var(--border);"><strong>' + esc(m) + '</strong><p style="font-size:13px;color:var(--text-muted);margin-top:4px;">Подробности по запросу</p></div>';
    }).join('');
  } else {
    methodsTab.innerHTML = '<p style="font-size:15px;color:var(--text-muted);">Информация уточняется</p>';
  }

  // Related products
  renderRelated(p);
  observeAnim();
}

function renderRelated(p) {
  var grid = document.getElementById('pRelatedGrid');
  var related = productsData.filter(function(x) {
    return x.id !== p.id && x.category && p.category && x.category.toLowerCase() === p.category.toLowerCase();
  }).slice(0, 4);
  if (related.length === 0) {
    related = productsData.filter(function(x) { return x.id !== p.id; }).slice(0, 4);
  }
  grid.innerHTML = related.map(function(x, i) {
    var img = x.image_thumb || x.image_local || x.image_url || '';
    return '<div class="product-card anim' + (i ? ' d' + (i + 1) : '') + '">' +
      '<div class="product-img"><div class="product-colors"><span style="background:#fff"></span></div>' +
      '<img src="' + esc(img) + '" alt="' + esc(x.name) + '" loading="lazy" onerror="this.src=\'https://placehold.co/300x300/eee/999?text=No+Image\'">' +
      '</div><div class="product-body"><div class="name">' + esc(x.name) + '</div>' +
      '<div class="price">' + (x.price ? x.price + ' ₽' : 'По запросу') + '</div>' +
      '<div class="meta"><button class="btn-request" onclick="location.href=\'/p/' + x.id + '.html'\'">Подробнее</button></div></div></div>';
  }).join('');
  observeAnim();
}

function changeMainImage(el, src) {
  document.getElementById('pMainImage').src = src;
  document.querySelectorAll('#pThumbs .thumb.active').forEach(function(t) { t.classList.remove('active'); });
  el.classList.add('active');
}

function switchTab(el, tab) {
  document.querySelectorAll('.tab-btn').forEach(function(b) {
    b.style.background = 'var(--light-alt)';
    b.style.color = 'var(--text-muted)';
  });
  el.style.background = 'var(--accent)';
  el.style.color = '#fff';
  document.querySelectorAll('.tab-content').forEach(function(t) { t.style.display = 'none'; });
  var target = document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1));
  if (target) target.style.display = 'block';
}





</script>

<script>
(async function(){
  window.productsData = window.__productData ? [window.__productData] : [];
  var p = window.__productData;
  if(p){
    currentProduct = p;
    renderProduct(p);
  }
})();
</script>
